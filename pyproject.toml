[project]
name = "asteroids-game-using-pygame"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame==2.6.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pydocstyle>=6.3.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-lint>=1.0.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "docs/*"]

[tool.bandit]
exclude_dirs = [".venv", "docs", "tests"]
skips = ["B311"]

[tool.pydocstyle]
convention = "google"
match_dir = "(?!\\.venv|docs|tests)"
add_ignore = ["D417"]

[tool.pylint.typecheck]
ignored-modules = ["pygame"]

[tool.pylint."messages-control"]
disable = ["R0801", "W0621"]
